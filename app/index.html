<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Deployment Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 80px 20px;
            color: #1e293b;
        }
        .card {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 45px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { color: #2563eb; }
        .status { color: #16a34a; font-weight: bold; }
        .tools { margin-top: 25px; line-height: 2; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps Deployment Dashboard</h1>
        <h2>Automated CI/CD Deployment</h2>
        <p class="status">Application Status: Running</p>
        <p>Environment: Azure Ubuntu VM</p>
        <p>Deployment Method: Jenkins + Ansible</p>
        <div class="tools">
            <strong>Technology Stack</strong>
            <p>GitHub | Jenkins | Docker | Azure ACR | Ansible</p>
        </div>
        <p>ESIS Assignment - 2026</p>
    </div>
</body>
</html>
